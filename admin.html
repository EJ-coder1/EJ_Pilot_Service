<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>EJ Pilot Admin</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;background:#070b12;color:#edf2fb}body{margin:0;background:radial-gradient(circle at top,#151d2d,#070b12 60%);min-height:100vh}.wrap{max-width:1100px;margin:auto;padding:28px 18px}.panel{background:#101724;border:1px solid #263246;border-radius:16px;padding:18px;margin-bottom:18px}h1{margin:0 0 6px}p{color:#9ba7ba}.row{display:grid;grid-template-columns:1fr auto;gap:10px}input,button{font:inherit}input{width:100%;box-sizing:border-box;padding:12px;border-radius:10px;border:1px solid #2c3a50;background:#0a101b;color:#fff}button{padding:11px 14px;border-radius:10px;border:1px solid #33435b;background:#172235;color:#fff;cursor:pointer}button.primary{background:#335eea;border-color:#4d73f0}button:hover{filter:brightness(1.08)}.order{border-top:1px solid #263246;padding:14px 0}.order:first-child{border-top:0}.meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;color:#aeb9c9;font-size:13px}.meta strong{color:#fff}.status{display:inline-block;border-radius:999px;padding:4px 8px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;background:#2a3446}.approved{background:#153e2c;color:#8be0b0}.pending{background:#4a3913;color:#ffd779}.contact{padding:12px 0;border-top:1px solid #263246}.muted{font-size:12px;color:#7e8a9e}@media(max-width:700px){.row{grid-template-columns:1fr}.meta{grid-template-columns:1fr}}
  </style>
</head>
<body>
<main class="wrap">
  <div class="panel">
    <h1>EJ Pilot Admin</h1>
    <p>Use the server-side admin token. Payment credentials never live in this page.</p>
    <div class="row"><input id="token" type="password" autocomplete="off" placeholder="Admin token"><button class="primary" id="load">Load orders</button></div>
  </div>
  <section class="panel"><h2>Orders</h2><div id="orders">Enter the admin token to load orders.</div></section>
  <section class="panel"><h2>Contact submissions</h2><div id="contacts">Load orders first.</div></section>
</main>
<script>
let token='';
const ordersEl=document.querySelector('#orders');const contactsEl=document.querySelector('#contacts');
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'}[c]));}
async function api(path,opts={}){opts.headers={...(opts.headers||{}),Authorization:'Bearer '+token};const r=await fetch(path,opts);const d=await r.json();if(!r.ok)throw new Error(d.error||'Request failed');return d;}
async function load(){token=document.querySelector('#token').value.trim();if(!token){ordersEl.textContent='Enter the admin token.';return;}ordersEl.textContent='Loading…';try{const [orders,contacts]=await Promise.all([api('/api/admin/orders'),api('/api/admin/contacts')]);contactsEl.innerHTML=contacts.length?contacts.map(c=>`<article class="contact"><strong>${esc(c.topic)}</strong><div class="muted">${esc(c.name)}${c.email?' · '+esc(c.email):''} · ${esc(c.createdAt)}</div><p>${esc(c.message)}</p></article>`).join(''):'No contact submissions yet.';ordersEl.innerHTML=orders.length?orders.map(o=>`<article class="order"><div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start"><div><strong>${esc(o.orderId)}</strong><span class="status ${o.status==='approved'?'approved':'pending'}">${esc(o.status)}</span></div><span class="muted">${esc(o.createdAt)}</span></div><div class="meta" style="margin-top:10px"><div>Customer <strong>${esc(o.customerName)}</strong></div><div>Payment <strong>${esc(o.paymentMethod)}</strong></div><div>Rank <strong>${esc(o.currentRank)} → ${esc(o.targetRank)}</strong></div><div>MMR <strong>${esc(o.mmrServer)}${o.mmrTopTarget?` · Top ${esc(o.mmrTopTarget)}`:''}</strong></div><div>Hero <strong>${esc(o.preferredHero)}</strong></div><div>Estimate <strong>${esc(o.estimate)}</strong></div></div><div style="margin-top:12px">${o.status==='approved'?'<span class="muted">Payment details unlocked for this Order ID.</span>':'<button class="primary" onclick="approve(\''+esc(o.orderId)+'\')">Approve order</button>'}</div></article>`).join(''):'No orders yet.';}catch(e){ordersEl.textContent=e.message;}}
async function approve(id){try{await api('/api/admin/orders/'+encodeURIComponent(id)+'/approve',{method:'POST'});await load();}catch(e){alert(e.message);}}
window.approve=approve;document.querySelector('#load').addEventListener('click',load);
</script>
</body>
</html>
